# Enhanced OCC Smoke Test Configuration
# Minimal test to verify Enhanced OCC runs without crashes
#
# Usage: ./build/labtest -f config/occ_smoke_test.yml
#
# Expected runtime: <10 seconds
# Purpose: Quick verification that system works before creating full test suite

# Minimal topology: 1 server, 1 client, single process
site:
  server:
    - ["s101:8100"]  # Single server partition
  client:
    - ["c101"]        # Single client

process:
  s101: localhost
  c101: localhost

host:
  localhost: 127.0.0.1

mode:
  cc: occ_enhanced    # Enhanced OCC concurrency control
  ab: none            # No atomic broadcast (single node)
  read_only: occ_enhanced
  batch: false
  retry: 20
  ongoing: 1

# Batch Validation Configuration (minimal settings for fast testing)
batch_validation:
  enabled: true
  batch_size: 8           # Small batch for fast testing
  batch_timeout_us: 100
  num_workers: 2          # Minimal workers

# Early Abort Detection Configuration
early_abort:
  enabled: true
  check_interval: 5       # Check frequently (every 5 operations)
  bloom_filter_size: 10000

# Workload: RW benchmark with small dataset
bench:
  workload: rw
  scale: 1
  weight:
    read: 0               # 100% writes (creates more conflicts)
    write: 1
  population:
    history: 100          # Only 100 keys (small workload for fast testing)

# Schema: Single table with 2 columns
schema:
  - name: history
    column:
      - {name: h_key, type: integer, primary: true}
      - {name: h_c_id, type: integer}

# Sharding strategy
sharding:
  history: MOD
