# Enhanced OCC Configuration - Both Features Enabled
# This config enables both batch validation and early abort detection
#
# Usage: ./build/labtest -f config/occ_enhanced.yml
#        ./build/dbtest -f config/occ_enhanced.yml
#
# Features:
#   - Parallel batch validation: Validates transactions in parallel batches
#   - Early abort detection: Detects conflicts during execution and aborts early
#
# Expected improvements over baseline OCC:
#   - 40-60% reduction in abort rates
#   - 2-5x better throughput on high-contention workloads
#   - Minimal overhead on low-contention workloads

mode:
  cc: occ_enhanced    # Enhanced OCC concurrency control
  ab: none            # No atomic broadcast (single node)
  read_only: occ
  batch: false
  retry: 20
  ongoing: 1

# Batch Validation Configuration
batch_validation:
  enabled: true
  batch_size: 32          # Maximum transactions per batch
  batch_timeout_us: 100   # Maximum wait time for batch (microseconds)
  num_workers: 8          # Number of parallel validation worker threads

# Early Abort Detection Configuration
early_abort:
  enabled: true
  check_interval: 10      # Check for abort every N operations
  bloom_filter_size: 10000  # Size of bloom filter for conflict pre-filtering

# Performance Tuning
# Adjust these based on workload characteristics:
#   High contention: Smaller batch_size (16-32), more frequent checks (5-10)
#   Low contention: Larger batch_size (64-128), less frequent checks (20-50)

