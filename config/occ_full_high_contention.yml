# Enhanced OCC - Full Configuration - HIGH CONTENTION
# Both batch validation and early abort enabled
#
# Usage: ./build/labtest -f config/occ_full_high_contention.yml -d 60 -n 8
#
# Purpose: High contention test to measure abort rates and throughput improvements
# Uses small table (10 keys) to force conflicts between transactions

site:
  server:
    - ["s101:8100"]
  client:
    - ["c101"]

process:
  s101: localhost
  c101: localhost

host:
  localhost: 127.0.0.1

mode:
  cc: occ_enhanced
  ab: none
  read_only: occ_enhanced
  batch: false
  retry: 20
  ongoing: 1

batch_validation:
  enabled: true          # ENABLED
  batch_size: 64         # Larger max batch size
  batch_timeout_us: 100 # 5ms - more time for batch to fill (reduces sync overhead)
  num_workers: 4
  parallel_threshold: 8  # Higher threshold for parallel validation

early_abort:
  enabled: true          # ENABLED
  check_interval: 10
  bloom_filter_size: 10000

# Workload: RW benchmark with HIGH contention
bench:
  workload: rw
  scale: 1
  weight:
    read: 0.5
    write: 0.5
  population:
    history: 10          # SMALL table (10 keys) = HIGH contention

schema:
  - name: history
    column:
      - {name: h_key, type: integer, primary: true}
      - {name: h_c_id, type: integer}

sharding:
  history: MOD
