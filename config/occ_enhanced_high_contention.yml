# Enhanced OCC - High Contention Test
# ongoing: 8 concurrent transactions, 100 keys = high contention

site:
  server:
    - ["s101:8100"]
  client:
    - ["c101"]

process:
  s101: localhost
  c101: localhost

host:
  localhost: 127.0.0.1

mode:
  cc: occ_enhanced     # ENHANCED OCC
  ab: none
  read_only: occ_enhanced
  batch: false
  retry: 20
  ongoing: 8           # ignored, for documentation only

n_concurrent: 8        # HIGH CONTENTION: 8 concurrent transactions

batch_validation:
  enabled: false        # DISABLED for early-abort-only test
  batch_size: 1
  batch_timeout_us: 0
  num_workers: 0
  parallel_threshold: 1

early_abort:
  enabled: true
  check_interval: 5

bench:
  workload: rw
  scale: 1
  weight:
    read: 0.5           # Match baseline: 50/50
    write: 0.5
  population:
    history: 10         # Match baseline: 10 keys

schema:
  - name: history
    column:
      - {name: h_key, type: integer, primary: true}
      - {name: h_c_id, type: integer}

sharding:
  history: MOD
